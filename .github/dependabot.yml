# Dependency update PRs.
#
# Two ecosystems, because they live in different files: NuGet packages are
# declared in grader-app/grader-app.csproj, and the pinned action versions
# (checkout, setup-dotnet, codeql-action) live in .github/workflows/.
# Without the github-actions entry those pins silently rot.

version: 2

updates:
  # PackageReference lives in the project file, not the root solution.
  - package-ecosystem: nuget
    directory: "/grader-app"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"