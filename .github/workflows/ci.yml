name: Build and fast tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore grader-app.sln
      - run: dotnet format grader-app.sln --verify-no-changes --no-restore
      - run: dotnet build grader-app.sln -c Release --no-restore
      # Real-Isolate tests deliberately run in the configured VM validation lane.
      - run: dotnet test grader-app.sln -c Release --no-build --filter 'Category!=RealIsolate'
      - run: dotnet publish grader-app/grader-app.csproj -c Release -r linux-x64 --self-contained false -o artifacts/linux-x64
